services:
  api:
    build: ./api
    ports:
      - "8000:80"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/docs')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  client:
    build: ./post_client
    depends_on:
      api:
        condition: service_healthy
  
  ai:
    build: ./ai_structuriser
    depends_on:
      api:
        condition: service_healthy
      client:
        condition: service_completed_successfully
  
  database:
    image: mysql:8.3.0
    container_name: mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: example_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  db_data: